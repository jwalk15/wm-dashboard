<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walker Family</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1322" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Walker Family">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#F6F4EF; --card:#FFFFFF; --card2:#FBFAF7; --ink:#172033; --ink2:#3A4357; --muted:#727A8B; --faint:#A2A8B5;
  --line:rgba(23,32,51,.08); --track:rgba(23,32,51,.07);
  --accent:#4B5FD6; --accent-ink:#FFFFFF; --accent-soft:rgba(75,95,214,.10);
  --good:#1E8A57; --good-soft:rgba(30,138,87,.11); --bad:#C2453B; --bad-soft:rgba(194,69,59,.10);
  --amber:#9A6210; --amber-soft:#F7E9CF;
  --c2:#B58A55; --c3:#8C94A6;
  --shadow:0 1px 2px rgba(23,32,51,.04), 0 8px 24px -6px rgba(23,32,51,.08);
  --r:22px; --pad:20px;
  --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0A1322; --card:#111C30; --card2:#0E182A; --ink:#E9EDF5; --ink2:#C3CAD8; --muted:#8B96AC; --faint:#5C6780;
    --line:rgba(255,255,255,.07); --track:rgba(255,255,255,.08);
    --accent:#8FA2FF; --accent-ink:#0A1322; --accent-soft:rgba(143,162,255,.13);
    --good:#56C994; --good-soft:rgba(86,201,148,.13); --bad:#F27D72; --bad-soft:rgba(242,125,114,.13);
    --amber:#EBBC6E; --amber-soft:rgba(235,188,110,.13);
    --c2:#D6B488; --c3:#7D88A1;
    --shadow:0 0 0 1px rgba(255,255,255,.045), 0 10px 30px -10px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"cv11","ss03"}
.num{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum","lnum"}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- boot + lock ---------- */
#boot{min-height:100dvh;display:grid;place-items:center}
#boot img{width:56px;height:56px;border-radius:14px;opacity:.9;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(.94);opacity:.6}}
#lock{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(40px + env(safe-area-inset-top)) 28px calc(32px + env(safe-area-inset-bottom))}
.lock-inner{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;text-align:center}
.lock-mark{width:76px;height:76px;border-radius:20px;box-shadow:0 12px 30px -8px rgba(20,35,80,.45)}
.lock-title{font-size:27px;font-weight:680;letter-spacing:-.02em;margin:22px 0 4px}
.lock-sub{color:var(--muted);margin:0 0 30px;font-size:15px}
form.lock-form{width:100%;display:flex;flex-direction:column;gap:14px}
.field{position:relative}
.field input{width:100%;height:54px;border-radius:16px;border:1px solid var(--line);background:var(--card);
  padding:0 52px 0 18px;font-size:17px;outline:none;box-shadow:var(--shadow);transition:border-color .2s, box-shadow .2s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.field input::placeholder{color:var(--faint)}
.eye{position:absolute;right:6px;top:7px;width:40px;height:40px;border:0;background:none;border-radius:12px;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.eye:hover{background:var(--accent-soft)}
.check{display:flex;align-items:center;gap:10px;justify-content:flex-start;color:var(--ink2);font-size:14.5px;cursor:pointer;user-select:none;padding:2px 2px}
.check input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--faint);margin:0;display:grid;place-items:center;background:var(--card);cursor:pointer;transition:all .15s}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.check span{text-align:left}
.check small{color:var(--muted);font-size:12.5px;display:block}
.btn{height:54px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:620;font-size:16.5px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .1s, opacity .2s;box-shadow:0 8px 20px -8px var(--accent)}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.7;cursor:progress}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.lock-err{min-height:22px;font-size:14px;color:var(--bad);margin:2px 0 0;opacity:0;transition:opacity .25s}
.lock-err.show{opacity:1}
.lock-foot{margin-top:34px;color:var(--faint);font-size:12.5px;display:flex;gap:6px;align-items:center}
.demo-hint{margin-top:14px;font-size:13px;color:var(--accent);background:var(--accent-soft);padding:6px 12px;border-radius:99px}

/* ---------- app shell ---------- */
#app{max-width:1080px;margin:0 auto;padding:0 var(--pad) calc(40px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:5;margin:0 calc(-1 * var(--pad));padding:calc(10px + env(safe-area-inset-top)) var(--pad) 10px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.topbar-row{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.01em;font-size:16px}
.brand img{width:30px;height:30px;border-radius:9px}
.iconbtn{height:38px;padding:0 14px 0 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:7px;
  color:var(--ink2);font-size:14px;font-weight:550;cursor:pointer;box-shadow:var(--shadow)}
.example-bar{margin:10px 0 0;padding:8px 14px;border-radius:12px;font-size:12.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent);background:repeating-linear-gradient(135deg, var(--accent-soft) 0 10px, transparent 10px 20px), var(--card);
  border:1px dashed color-mix(in srgb, var(--accent) 55%, transparent);display:flex;gap:8px;align-items:center;justify-content:center}
.example-bar span{font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink2)}
.hello{padding:18px 0 4px}
.hello h1{font-size:30px;line-height:1.15;font-weight:690;letter-spacing:-.025em;margin:0 0 10px}
.fresh{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px}
.badge.stale{color:var(--amber);background:var(--amber-soft)}

section{margin-top:34px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 12px}
.sh h2{font-size:19px;font-weight:670;letter-spacing:-.015em;margin:0}
.sh .meta{color:var(--muted);font-size:13.5px;white-space:nowrap}
.grid{display:grid;gap:12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:var(--pad);position:relative;overflow:hidden}
.label{font-size:13.5px;color:var(--muted);font-weight:550;display:flex;align-items:center;gap:8px;justify-content:space-between}
.label .l{display:flex;align-items:center;gap:8px}
.big{font-size:40px;font-weight:680;letter-spacing:-.03em;line-height:1.1;margin:8px 0 2px}
.big .cur{font-size:.6em;vertical-align:.5em;margin-right:2px;color:var(--ink2);font-weight:600}
.big .blank,.mid .blank{color:var(--faint);font-weight:500}
.big .blank{font-size:.7em}
.big .cents{font-size:.5em;color:var(--muted);font-weight:600;letter-spacing:0}
.mid{font-size:28px;font-weight:670;letter-spacing:-.025em;line-height:1.15;margin:6px 0 2px}
.mid .cur{font-size:.62em;vertical-align:.42em;margin-right:1px;color:var(--ink2)}
.mid .cents{font-size:.55em;color:var(--muted);font-weight:600}
.cap{color:var(--muted);font-size:13.5px}
.neg{color:var(--bad)}

.bucket-house{grid-column:1/-1}
.buckets{grid-template-columns:1fr 1fr}
.bucket-house .big{font-size:44px}
.tax{background:repeating-linear-gradient(135deg, transparent 0 9px, var(--track) 9px 10px), var(--card2)}
.tax .mid{color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;letter-spacing:.04em;padding:3px 9px;border-radius:99px;white-space:nowrap}
.chip.ns{color:var(--muted);background:var(--track);text-transform:uppercase}
.chip.good{color:var(--good);background:var(--good-soft)}
.chip.bad{color:var(--bad);background:var(--bad-soft)}
.chip.good::before,.chip.bad::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.focus{color:var(--accent);background:var(--accent-soft);letter-spacing:.01em}

.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.over i{background:var(--bad)}
.bar-legend{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--muted)}
.bar-legend b{color:var(--ink);font-weight:620}

.rows{list-style:none;margin:0;padding:0}
.rows li{padding:13px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0;padding-top:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row .name{font-weight:550;color:var(--ink);min-width:0}
.row .val{color:var(--ink);font-weight:600;white-space:nowrap}
.row .val small{color:var(--muted);font-weight:500}
.mini{height:5px;border-radius:99px;background:var(--track);margin-top:9px;overflow:hidden}
.mini i{display:block;height:100%;border-radius:99px;background:var(--accent);opacity:.85}
.mini.over i{background:var(--bad);opacity:1}
.mini.soft i{opacity:.35}
.over-note{color:var(--bad);font-size:12px;font-weight:600;margin-left:6px}
.mini.ok i{background:var(--good);opacity:.9}
.bar.ok i{background:var(--good)}
.asof{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.asof .badge{font-size:11.5px;padding:3px 8px}
.headline .of{font-size:15px;color:var(--muted);font-weight:500;margin-left:8px;white-space:nowrap}
.nobudget{margin-top:8px;font-size:12.5px;color:var(--muted)}
details.more{margin-top:4px}
details.more>summary{list-style:none;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;padding:10px 0 2px}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary .sa{display:none}
details.more:not([open])>summary .sl{display:none}
.bgroup{margin-top:14px;font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.bgroup .num{letter-spacing:0;text-transform:none;font-size:13px;color:var(--ink);font-weight:620}
.loanline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px}
.loanline .pay{font-size:14px;color:var(--muted);white-space:nowrap}
.loanline .pay b{color:var(--ink);font-weight:620}
.loan details.more .stats{margin-top:8px}
.skim{margin-top:6px;padding:14px 14px;border-radius:16px;border:1px dashed var(--faint);color:var(--muted);
  background:repeating-linear-gradient(135deg, transparent 0 9px, var(--track) 9px 10px)}
.skim .row .name,.skim .row .val{color:var(--muted)}
.skim .cap{font-size:12.5px;margin-top:3px}

.bill{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center}
.cal{width:46px;height:50px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.cal small{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.cal b{font-size:19px;font-weight:700;margin-top:3px}
.cal.nodate{background:var(--track);color:var(--faint)}
.cal.nodate b{margin:0}
.bill .name{font-weight:580}
.bill .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bill .amt{font-weight:620}
.bill-note{display:block;font-size:12.5px;color:var(--faint);margin-top:2px;overflow-wrap:anywhere}
.odd{display:flex;gap:12px;align-items:flex-start}
.odd .ic{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.odd ul{margin:2px 0 0;padding-left:18px}
.odd li{margin:2px 0}

.loan .top{display:flex;align-items:center;gap:12px}
.ord{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--accent-soft);color:var(--accent)}
.loan h3{margin:0;font-size:16px;font-weight:620;flex:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.stat small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:2px}
.stat b{font-weight:620;font-size:15.5px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink2);background:var(--accent-soft);border-radius:16px;padding:13px 15px;margin-bottom:12px}
.note svg{flex:none;margin-top:1px;color:var(--accent)}

.goal{display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:64px;height:64px}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:680}
.goal h3{margin:0 0 3px;font-size:16px;font-weight:620}
.goal .amt{font-weight:600}
.goal .amt small{color:var(--muted);font-weight:500}

.chartbox{position:relative;height:210px;margin-top:10px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:4px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.dash{background:none!important;border-top:2.5px dashed var(--c3);height:0;width:14px;border-radius:0}
.spark{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.spark .sbox{grid-column:1/-1;height:64px;position:relative;margin-top:8px}
.delta{font-size:13px;color:var(--muted);text-align:right}

.waiting{display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 12px 22px;color:var(--muted)}
.waiting .wi{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:12px}
.waiting b{color:var(--ink2);font-weight:620;font-size:15px}
.waiting p{margin:4px 0 0;font-size:13.5px;max-width:260px}
.waiting.sm{flex-direction:row;text-align:left;padding:4px 0;gap:14px}
.waiting.sm .wi{width:40px;height:40px;border-radius:12px;margin:0;flex:none}
.waiting.sm p{max-width:none}
.label + .waiting.sm{margin-top:12px}
.field input::selection{background:var(--accent-soft);color:var(--ink)}
.card:has(.ghosted){background:transparent;box-shadow:none;border:1.5px dashed var(--line)}
.waiting.ghosted p{margin:0;color:var(--muted)}
.waiting.ghosted .wi{background:var(--track);color:var(--faint)}
.hero-empty{padding:30px 22px;text-align:center}
.hero-empty .wi{width:64px;height:64px;border-radius:20px;margin:0 auto 14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.hero-empty h3{margin:0 0 6px;font-size:19px;font-weight:660;letter-spacing:-.01em}
.hero-empty p{margin:0 auto;color:var(--muted);max-width:290px;font-size:14px}

footer{margin-top:40px;color:var(--faint);font-size:12.5px;text-align:center;line-height:1.6}
.err-card{margin-top:30px}

@media (min-width:720px){
  :root{--pad:24px}
  .hello h1{font-size:36px}
  .buckets{grid-template-columns:1.3fr 1fr 1fr}
  .bucket-house{grid-column:auto}
  .two{grid-template-columns:1fr 1fr}
  .three{grid-template-columns:repeat(3,1fr)}
  .chartbox{height:260px}
  .catgrid .rows{display:grid;grid-template-columns:1fr 1fr;column-gap:36px}
  .catgrid .rows li{border-top:1px solid var(--line);padding-top:13px}
  .catgrid .rows li:nth-child(-n+2){border-top:0;padding-top:4px}
}
@media (min-width:1000px){ .goals{grid-template-columns:repeat(3,1fr)} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= Family Snapshot (generated into family/index.html) ================= */
body.has-tabs #app{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
.view{display:none}
.view.on{display:block;animation:viewIn .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateX(var(--dx,0px)) translateY(6px)}to{opacity:1;transform:none}}
.tabbar{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;
  width:min(calc(100% - 20px),520px);height:66px;border-radius:24px;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;
  background:color-mix(in srgb, var(--card) 80%, transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);
  box-shadow:0 0 0 1px var(--line), 0 14px 34px -12px rgba(15,25,50,.28)}
.tabbar .pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:18px;background:var(--accent-soft);
  transform:translateX(calc(var(--i,0) * 100%));transition:transform .38s cubic-bezier(.3,1.25,.4,1)}
.tabbar button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.01em;cursor:pointer;border-radius:18px;-webkit-tap-highlight-color:transparent;transition:color .25s}
.tabbar button svg{transition:transform .3s cubic-bezier(.3,1.4,.4,1)}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.tabbar button[aria-selected="true"] svg{transform:translateY(-1px) scale(1.06)}
.tabbar button:active svg{transform:scale(.9)}
.tabbar .tdot{position:absolute;top:8px;right:calc(50% - 17px);width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--card)}

.fhead{padding:18px 0 2px}
.fhead h1{font-size:30px;line-height:1.15;font-weight:690;letter-spacing:-.025em;margin:0 0 6px}
.fhead .sub{color:var(--muted);font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kidchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:640;padding:3px 9px 3px 7px;border-radius:99px;white-space:nowrap;

<body>
<div id="boot"><img src="icons/mark-256.png" alt=""></div>

<main id="lock" hidden>
  <div class="lock-inner">
    <img class="lock-mark" src="icons/mark-256.png" alt="">
    <h1 class="lock-title">Walker Family</h1>
    <p class="lock-sub">Our family dashboard</p>
    <form class="lock-form" id="lockForm" autocomplete="on">
      <input type="text" name="username" value="walker-money" autocomplete="username" hidden>
      <div class="field">
        <label class="sr" for="pw">Password</label>
        <input id="pw" name="password" type="password" placeholder="Password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
        <button type="button" class="eye" id="eye" aria-label="Show password">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <label class="check"><input type="checkbox" id="remember"><span>Remember on this device<small>Stays unlocked until you tap Lock</small></span></label>
      <button class="btn" id="unlockBtn" type="submit">Unlock</button>
      <p class="lock-err" id="lockErr" role="status" aria-live="polite"></p>
    </form>
    <div class="demo-hint" id="demoHint" hidden>Preview mode · password is <b>demo</b></div>
    <div class="lock-foot">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      Encrypted. Unlocks only on your device.
    </div>
  </div>
</main>

<div id="app" hidden></div>

<script>
(() => {
"use strict";
const TZ = "America/Denver";
const qs = new URLSearchParams(location.search);
const DEMO = qs.get("demo");
const SRC = DEMO === "empty" ? "demo/empty.enc" : DEMO === "stale" ? "demo/stale.enc" : DEMO ? "demo/data.enc" : "data.enc";
const STORE = "wm.remember." + (DEMO ? "demo-" + DEMO : "live");
const $ = (s, el = document) => el.querySelector(s);
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const ub64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
let charts = [], DATA = null;

/* ------------------------------------------------ crypto */
async function deriveKey(pw, env) {
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64(env.salt), iterations: env.iter },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
async function decryptEnv(env, pw) {
  const key = await deriveKey(pw, env);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(env.iv) }, key, b64(env.ct));
  return JSON.parse(dec.decode(pt));
}
let envPromise = null;
function loadEnv() {
  if (!envPromise) envPromise = fetch(SRC + "?t=" + Date.now(), { cache: "no-store" }).then(r => {
    if (!r.ok) throw new Error("fetch " + r.status);
    return r.json();
  });
  return envPromise;
}

/* "Remember me": the password is wrapped with a non-extractable AES key that lives
   in this browser's IndexedDB; only the wrapped blob goes in localStorage. */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("walker-money", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("k");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbDo(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction("k", mode), st = tx.objectStore("k"), rq = fn(st);
    tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error);
  });
}
async function deviceKey(create) {
  let k = await idbDo("readonly", st => st.get("device"));
  if (!k && create) {
    k = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    await idbDo("readwrite", st => st.put(k, "device"));
  }
  return k;
}
async function remember(pw) {
  try {
    const k = await deviceKey(true), iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, enc.encode(pw));
    localStorage.setItem(STORE, JSON.stringify({ iv: ub64(iv), ct: ub64(ct) }));
  } catch (e) { /* private mode etc: just don't remember */ }
}
async function recall() {
  try {
    const raw = localStorage.getItem(STORE); if (!raw) return null;
    const k = await deviceKey(false); if (!k) return null;
    const o = JSON.parse(raw);
    return dec.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(o.iv) }, k, b64(o.ct)));
  } catch (e) { return null; }
}
async function forgetAll() {
  Object.keys(localStorage).filter(k => k.startsWith("wm.remember.")).forEach(k => localStorage.removeItem(k));
  try { await idbDo("readwrite", st => st.delete("device")); } catch (e) {}
}

/* ------------------------------------------------ format helpers */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isNum = v => typeof v === "number" && isFinite(v);
const nf2 = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
function money(v, cents = true) {
  if (!isNum(v)) return "—";
  const s = (cents ? nf2 : nf0).format(Math.abs(v));
  return (v < 0 ? "−$" : "$") + s;
}
function bigMoney(v) {
  if (!isNum(v)) return '<span class="blank" title="Not recorded">—</span>';
  const [w, c] = nf2.format(Math.abs(v)).split(".");
  return `${v < 0 ? "−" : ""}<span class="cur">$</span>${w}<span class="cents">.${c}</span>`;
}
const kMoney = v => !isNum(v) ? "" : Math.abs(v) >= 1e6 ? "$" + (v / 1e6).toFixed(1) + "M" : Math.abs(v) >= 1e3 ? "$" + Math.round(v / 1e3) + "k" : "$" + Math.round(v);
const ymd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d || 1, 12)); };
const fmtD = (s, o) => s ? new Intl.DateTimeFormat("en-US", { timeZone: "UTC", ...o }).format(ymd(s)) : "—";
const dayShort = s => fmtD(s, { month: "short", day: "numeric" });
const monthYear = s => fmtD(s, { month: "short", year: "numeric" });
const longDate = s => fmtD(s, { month: "short", day: "numeric", year: "numeric" });
function weekRange(a, b) {
  if (!a || !b) return a ? "Week of " + dayShort(a) : "";
  const A = ymd(a), B = ymd(b);
  return A.getUTCMonth() === B.getUTCMonth() ? `${dayShort(a)} – ${B.getUTCDate()}` : `${dayShort(a)} – ${dayShort(b)}`;
}
const cap1 = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : "";
function denverParts(d, o) {
  const p = {}; new Intl.DateTimeFormat("en-US", { timeZone: TZ, ...o }).formatToParts(d).forEach(x => p[x.type] = x.value); return p;
}
function freshness(data) {
  let when = data.updated_at ? new Date(data.updated_at) : data.latest_snapshot_date ? new Date(data.latest_snapshot_date + "T12:00:00-06:00") : null;
  if (!when || isNaN(when)) return null;
  const ageDays = (Date.now() - when.getTime()) / 864e5;
  let label;
  if (data.updated_at) {
    const p = denverParts(when, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", hour12: true });
    const t = `${p.hour}:${p.minute}${(p.dayPeriod || "").toLowerCase()}`;
    label = ageDays < 6 ? `Updated ${p.weekday} ${t} MT` : `Updated ${p.month} ${p.day}, ${t} MT`;
  } else label = `Snapshot ${dayShort(data.latest_snapshot_date)}`;
  return { label, ageDays, stale: ageDays > (data.stale_after_days || 8) };
}
function greeting() {
  const h = +denverParts(new Date(), { hour: "numeric", hour12: false }).hour % 24;
  return h < 5 ? "Good evening" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
}

/* ------------------------------------------------ icons */
const I = {
  lock: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
  hour: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9"/></svg>',
  sprout: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-9"/><path d="M12 12c0-4 3-7 8-7 0 4-3 7-8 7z"/><path d="M12 14c0-3-2.5-5.5-7-5.5 0 3 2.5 5.5 7 5.5z"/></svg>',
  shield: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.3 8-8 9-4.7-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  eye: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  check: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  clock: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
};
let EMPTY = false;
const waiting = (sm, msg, title) => sm && EMPTY
  ? `<div class="waiting sm ghosted"><div class="wi">${I.sprout}</div><p>${msg}</p></div>`
  : sm
  ? `<div class="waiting sm"><div class="wi">${I.sprout}</div><div><b>${title || "Waiting for CFO's first snapshot"}</b><p>${msg || "This fills in after the next update."}</p></div></div>`
  : `<div class="waiting"><div class="wi">${I.hour}</div><b>Waiting for CFO's first snapshot</b><p>${msg || "This fills in after the next update."}</p></div>`;

/* ------------------------------------------------ render */
function pct(a, b) { return isNum(a) && isNum(b) && b > 0 ? Math.max(0, Math.min(1, a / b)) : 0; }
function progress(spent, target, word) {
  const over = isNum(spent) && isNum(target) && spent > target;
  return `<div class="bar ${over ? "over" : ""}"><i style="width:${(pct(spent, target) * 100).toFixed(1)}%"></i></div>
    <div class="bar-legend num"><span><b>${money(spent, false)}</b> spent</span><span>${over ? `<span class="neg">${money(spent - target, false)} over</span> · ` : ""}${money(target, false)} ${word}</span></div>`;
}
const catName = c => (DATA && DATA.labels && DATA.labels.category_display || {})[c] || cap1(c);
function asOf(snap, today) {
  if (!snap) return "";
  const age = Math.floor((ymd(today) - ymd(snap)) / 864e5);
  return `<span class="asof"><span>as of ${esc(dayShort(snap))}</span>${age > 8 ? `<span class="badge stale">${I.clock}Stale · ${age} days</span>` : ""}</span>`;
}
function headline(label, spent, target, word) {
  const over = isNum(spent) && isNum(target) && spent > target;
  return `<div class="card headline"><div class="label"><span class="l">${label}</span></div>
    <div class="big num ${over ? "neg" : ""}">${bigMoney(spent)}<span class="of">of ${money(target)}</span></div>
    ${isNum(spent) ? "" : '<div class="cap">Not recorded in this snapshot</div>'}
    ${isNum(spent) && isNum(target) ? `<div class="bar ${over ? "over" : "ok"}"><i style="width:${(pct(spent, target) * 100).toFixed(1)}%"></i></div>
    <div class="bar-legend num"><span>${over ? '<span class="neg">Over</span>' : "Under"} ${esc(word)}</span><span>${Math.round(spent / target * 100)}%</span></div>` : ""}</div>`;
}
function catBlock(items) {
  const anyBudget = items.some(i => isNum(i.budget) && i.budget > 0);
  const sorted = items.slice().sort((a, b) => (isNum(b.spent) ? b.spent : -1) - (isNum(a.spent) ? a.spent : -1));
  const top = sorted.slice(0, 5), rest = sorted.slice(5);
  return `${anyBudget ? "" : '<div class="nobudget">No budgets set</div>'}${catRows(top)}${rest.length
    ? `<details class="more"><summary><span class="sa">Show all ${items.length}</span><span class="sl">Show fewer</span></summary>${catRows(rest)}</details>` : ""}`;
}
function catRows(items) {
  return `<ul class="rows">${items.map(it => {
    const has = isNum(it.budget) && it.budget > 0, over = has && isNum(it.spent) && it.spent > it.budget;
    return `<li><div class="row"><span class="name">${esc(catName(it.category))}</span>
      <span class="val num">${money(it.spent, false)}${has ? ` <small>/ ${money(it.budget, false)}</small>` : ""}${over ? `<span class="over-note">over</span>` : ""}</span></div>
      ${has ? `<div class="mini ${over ? "over" : "ok"}"><i style="width:${(pct(it.spent, it.budget) * 100).toFixed(1)}%"></i></div>` : ""}</li>`;
  }).join("")}</ul>`;
}

function render(data) {
  DATA = data;
  EMPTY = !data.has_data;
  const f = freshness(data);
  const W = data.weekly, M = data.monthly, C = data.categories || {};
  const TODAY = (() => { const p = denverParts(new Date(), { year: "numeric", month: "2-digit", day: "2-digit" }); return `${p.year}-${p.month}-${p.day}`; })();
  const out = [];

  const topbar = (`<header class="topbar"><div class="topbar-row">
      <div class="brand"><img src="icons/mark-256.png" alt=""><span id="brandName">Walker Family</span></div>
      <button class="iconbtn" id="lockBtn" aria-label="Lock">${I.lock}Lock</button></div>
      ${data.example ? `<div class="example-bar">Example data <span>· made-up numbers for preview</span></div>` : ""}
    </header>`);
  out.push(`<div class="hello"><h1>Money</h1><div class="fresh">${f
      ? `<span class="dot" style="${f.stale ? "background:var(--amber)" : ""}"></span><span class="num">${esc(f.label)}</span>${f.stale ? `<span class="badge stale">${I.clock}Stale · ${Math.floor(f.ageDays)} days old</span>` : ""}`
      : `<span class="dot" style="background:var(--faint)"></span>No snapshots yet`}</div></div>`);

  if (!data.has_data) {
    out.push(`<section><div class="card hero-empty"><div class="wi">${I.hour}</div><h3>Waiting for CFO's first snapshot</h3>
      <p>Once the first weekly numbers arrive, everything here fills in on its own.</p></div></section>`);
  }

  /* cash buckets */
  const B = W || M;
  out.push(`<section><div class="sh"><h2>Cash</h2><span class="meta">${B ? asOf(B.snapshot_date, TODAY) : "Three buckets · never blended"}</span></div>
    ${B ? `<div class="grid buckets">
      <div class="card bucket-house"><div class="label"><span class="l">Household</span></div><div class="big num">${bigMoney(B.household_cash)}</div><div class="cap">Family spending money</div></div>
      <div class="card"><div class="label"><span class="l">Practice</span></div><div class="mid num">${bigMoney(B.practice_cash)}</div><div class="cap">${esc((data.labels && data.labels.practice_entity) || "Practice operating cash")}</div></div>
      <div class="card tax"><div class="label"><span class="l">Tax reserve</span></div><div class="mid num">${bigMoney(B.tax_reserve)}</div><div style="margin-top:6px"><span class="chip ns">${I.lock} Not spendable</span></div></div>
    </div>` : `<div class="card">${waiting(true, "Household, Practice and Tax reserve will show here — always kept separate.")}</div>`}</section>`);

  /* this week */
  const wTarget = W ? (isNum(W.weekly_burn_target) ? W.weekly_burn_target : W.weekly_burn_target_default) : null;
  let bills = data.bills && data.bills.items || [];
  const isPaid = b => /\b(paid|autopay)\b/i.test(b.item || "") || /^paid/i.test(b.status || "");
  if (W && W.week_start && W.week_end) bills = bills.filter(b => b.due_date ? (b.due_date >= W.week_start && b.due_date <= W.week_end) : !isPaid(b));
  const billsDue = bills.filter(b => !isPaid(b)), billsPaid = bills.filter(isPaid);
  const sum = xs => xs.reduce((t, b) => t + (isNum(b.amount) ? b.amount : 0), 0);
  const billLi = b => `<li><div class="bill">
            ${b.due_date ? `<div class="cal"><small>${esc(fmtD(b.due_date, { weekday: "short" }))}</small><b class="num">${ymd(b.due_date).getUTCDate()}</b></div>` : `<div class="cal nodate"><b>—</b></div>`}
            ${billText(b)}
            <div class="right"><span class="amt num">${money(b.amount, false)}</span>${b.status ? `<span class="chip ${b.status === "GREEN" ? "good" : "bad"}">${esc(b.status)}</span>` : ""}</div></div></li>`;
  const wkCat = C.week && C.week.items.length && C.week.period_start === (W && W.week_start) ? C.week : null;
  out.push(`<section><div class="sh"><h2>This week</h2><span class="meta num">${W ? esc(weekRange(W.week_start, W.week_end)) + " · " + asOf(W.snapshot_date, TODAY) : ""}</span></div>
    ${W ? `<div class="grid two">
      ${headline("Spent this week", W.spend_to_date, wTarget, isNum(W.weekly_burn_target) ? "weekly target" : "default target")}
      <div class="card"><div class="label"><span class="l">Spending by category</span>${wkCat && wkCat.snapshot_date !== W.snapshot_date ? asOf(wkCat.snapshot_date, TODAY) : ""}</div>
        ${wkCat ? catBlock(wkCat.items) : waiting(true, "Category totals for this week will show here.", "Not recorded yet")}</div>
    </div>` : `<div class="card">${waiting(true, "Spending vs the weekly target, bills and odd charges.")}</div>`}
    <div class="grid two" style="margin-top:12px">
      <div class="card"><div class="label"><span class="l">Bills this week</span>${data.bills ? asOf(data.bills.snapshot_date, TODAY) : ""}</div>
        ${data.bills ? (bills.length ? `
          <div class="bgroup"><span>Due</span><span class="num">${money(sum(billsDue), false)}</span></div>
          ${billsDue.length ? `<ul class="rows" style="margin-top:6px">${billsDue.map(billLi).join("")}</ul>` : `<p class="cap" style="margin:6px 0 0">Nothing left to pay by hand.</p>`}
          ${billsPaid.length ? `<div class="bgroup"><span>Paid / autopay</span><span class="num">${money(sum(billsPaid), false)}</span></div>
          <ul class="rows" style="margin-top:6px">${billsPaid.map(billLi).join("")}</ul>` : ""}`
          : `<p class="cap">No bills due this week.</p>`) : waiting(true, "Bills due this week with a GREEN / RED check.")}</div>
      <div class="card"><div class="label"><span class="l">Odd charges · last 48h</span></div>
        ${W ? oddCharges(W.odd_charges_48h) : waiting(true, "Anything unusual from the last 48 hours.")}</div>
    </div></section>`);

  /* this month */
  const mTarget = M ? (isNum(M.monthly_burn_target) ? M.monthly_burn_target : M.monthly_burn_target_default) : null;
  const monthName = M && M.month ? fmtD(M.month + "-01", { month: "long", year: "numeric" }) : "";
  const allowed = data.categories_allowed || [];
  let monthItems = null;
  if (C.month) { const by = {}; C.month.items.forEach(i => by[i.category] = i); monthItems = allowed.map(c => by[c] || { category: c, spent: null, budget: null }); }
  const moCat = C.month && C.month.items.length ? C.month : null;
  out.push(`<section><div class="sh"><h2>This month</h2><span class="meta">${esc(monthName)}${M ? " · " + asOf(M.snapshot_date, TODAY) : ""}</span></div>
    ${M ? `<div class="grid two">
      ${headline("Spent this month", M.spend_to_date, mTarget, isNum(M.monthly_burn_target) ? "monthly target" : "default target")}
      <div class="card"><div class="label"><span class="l">Income received</span></div><div class="big num">${bigMoney(M.income_received)}</div>
        <div class="cap">Before the tax skim</div></div>
    </div>` : ""}
    <div class="card" style="margin-top:${M ? 12 : 0}px"><div class="label"><span class="l">Spending by category</span>${moCat ? `<span>${moCat.items.some(i => isNum(i.budget) && i.budget > 0) ? "vs budget" : ""}${moCat.snapshot_date !== (M && M.snapshot_date) ? " " + asOf(moCat.snapshot_date, TODAY) : ""}</span>` : ""}</div>
      ${monthItems ? `<div class="catgrid" style="margin-top:10px">${catBlock(monthItems)}</div>` : waiting(true, "All 12 categories vs budget.")}
      ${M ? `<div class="skim"><div class="row"><span class="name">${I.lock.replace('width="15" height="15"', 'width="13" height="13" style="vertical-align:-1px;margin-right:6px"')}Tax skim</span><span class="val num">${money(M.tax_skim_20pct)}</span></div>
        <div class="cap">20% of net production bonus · set aside for taxes, not spendable</div></div>` : ""}
    </div></section>`);

  /* debt */
  const loans = data.loans && data.loans.items || [];
  const focus = loans.find(l => !(isNum(l.balance) && l.balance <= 0));
  out.push(`<section><div class="sh"><h2>Debt payoff</h2><span class="meta">${data.loans ? asOf(data.loans.snapshot_date, TODAY) : "Locked order"}</span></div>
    <div class="note">${I.shield}<span>${esc((data.labels && data.labels.extra_principal_rule) || "Extra principal comes only from household surplus or cancelled leaks.")}</span></div>
    ${loans.length ? `<div class="grid three">${loans.map(l => `<div class="card loan">
        <div class="top"><span class="ord num">${l.loan_order}</span><h3>${esc(cap1(l.loan_name))}</h3>${l === focus ? `<span class="chip focus">Extra goes here</span>` : ""}</div>
        <div class="loanline"><div class="mid num">${bigMoney(l.balance)}</div>
          <span class="pay num">${isNum(l.payment) ? `<b>${money(l.payment)}</b>/mo` : "Payment —"}</span></div>
        <div class="cap">${isNum(l.balance) ? "Balance" : "Balance not recorded in the latest update"}</div>
        <details class="more"><summary><span class="sa">Details</span><span class="sl">Hide details</span></summary>
        <div class="stats num">
          <div class="stat"><small>Rate</small><b>${isNum(l.rate_pct) ? l.rate_pct.toFixed(2) + "%" : "—"}</b></div>
          <div class="stat"><small>Payment</small><b>${money(l.payment)}${isNum(l.payment) ? '<span class="cap">/mo</span>' : ""}</b></div>
          <div class="stat"><small>Extra principal paid</small><b>${money(l.extra_principal_paid, false)}</b></div>
          <div class="stat"><small>Projected payoff</small><b>${l.projected_payoff_date ? esc(monthYear(l.projected_payoff_date)) : "—"}</b></div>
        </div></details></div>`).join("")}</div>`
      : `<div class="card">${waiting(true, "Each loan in locked payoff order, with balance, rate and payoff date.")}</div>`}</section>`);

  /* goals */
  const goals = data.goals && data.goals.items || [];
  out.push(`<section><div class="sh"><h2>Savings goals</h2></div>
    ${goals.length ? `<div class="grid goals two">${goals.map(g => {
      const p = pct(g.current_balance, g.target_amount), r = 27, c = 2 * Math.PI * r;
      return `<div class="card goal"><div class="ring"><svg width="64" height="64" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--track)" stroke-width="6"/>
          <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(c * p).toFixed(2)} ${c.toFixed(2)}"/></svg>
          <span class="num">${isNum(g.target_amount) ? Math.round(p * 100) + "%" : "—"}</span></div>
        <div><h3>${esc(g.goal_name)}</h3><div class="amt num">${money(g.current_balance, false)} <small>of ${money(g.target_amount, false)}</small></div>
          <div class="cap">${g.target_date ? "by " + esc(longDate(g.target_date)) : "No target date"}</div></div></div>`;
    }).join("")}</div>` : `<div class="card">${waiting(true, "Each goal with its target, date and a progress ring.")}</div>`}</section>`);

  /* trends: a chart only once it has 2+ data points */
  const mb = (data.history && data.history.monthly_buckets) || [];
  const lh = data.history && data.history.loan_balances;
  const lser = lh ? lh.series.filter(x => x.balances.filter(isNum).length >= 2) : [];
  const starts = t => `<p class="cap" style="margin:8px 0 0">${t} · starts after 2 updates</p>`;
  out.push(`<section><div class="sh"><h2>Trends</h2></div>
    <div class="grid">
      <div class="card"><div class="label"><span class="l">Cash buckets by month</span></div>
        ${mb.length > 1 ? `<div class="legend"><span><i style="background:var(--accent)"></i>Household</span><span><i style="background:var(--c2)"></i>Practice</span><span><i class="dash"></i>Tax reserve</span></div>
          <div class="chartbox"><canvas id="cashChart" aria-label="Cash buckets by month"></canvas></div>` : starts(mb.length ? "1 month so far" : "No months yet")}</div>
      <div class="card"><div class="label"><span class="l">Loan balances</span></div>
        ${lser.length ? `<ul class="rows" style="margin-top:10px">${lser.map(s => {
          const vals = s.balances.filter(isNum), first = vals[0], last = vals[vals.length - 1];
          const firstIdx = s.balances.findIndex(isNum);
          return `<li><div class="spark"><div><div class="name" style="font-weight:600"><span class="ord num" style="display:inline-grid;width:22px;height:22px;font-size:12px;margin-right:8px">${s.loan_order}</span>${esc(cap1(s.loan_name))}</div></div>
            <div class="delta num"><b style="color:var(--ink);font-weight:620">${money(last, false)}</b>${first !== last ? `<br>${last < first ? "↓" : "↑"} ${money(Math.abs(last - first), false)} since ${esc(dayShort(lh.dates[firstIdx]))}` : ""}</div>
            <div class="sbox"><canvas id="loan${s.loan_order}"></canvas></div></div></li>`;
        }).join("")}</ul>${lser.length < lh.series.length ? starts("Other loans") : ""}` : starts("Balances")}</div>
    </div></section>`);

  out.push(`<footer>${data.example ? "<b>EXAMPLE DATA</b> — not real numbers<br>" : ""}Private · end-to-end encrypted · times in Mountain Time<br>Source: ${esc(data.source || "snapshot sheet")}</footer>`);

  const app = $("#app");
  app.innerHTML = renderShell(data, topbar, out.join(""));
  $("#boot").hidden = true; $("#lock").hidden = true; app.hidden = false;
  $("#lockBtn").addEventListener("click", lockNow);
  wireTabs();
  whenChart(drawCharts);
}

function billText(b) {
  const m = /^(.*?)\s*\((.+)\)\s*$/.exec(b.item || "");
  const title = m ? m[1] : b.item, note = m ? m[2] : "";
  const when = b.due_date ? fmtD(b.due_date, { weekday: "long", month: "short", day: "numeric" }) : "Due date not recorded";
  return `<div style="min-width:0"><div class="name">${esc(title)}</div><div class="cap">${esc(when)}${note ? `<span class="bill-note">${esc(note)}</span>` : ""}</div></div>`;
}
function oddCharges(t) {
  if (!t || /^none$/i.test(t.trim())) return `<div class="odd" style="margin-top:12px"><div class="ic">${I.check}</div><div><b style="font-weight:600">None</b><div class="cap">Nothing unusual in the last 48 hours.</div></div></div>`;
  const parts = t.split(/\s*;\s*|\n+/).filter(Boolean);
  return `<div class="odd" style="margin-top:12px"><div class="ic">${I.eye}</div><div>${parts.length > 1 ? `<ul>${parts.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : esc(t)}</div></div>`;
}

/* ------------------------------------------------ Family app: shell + tabs
   Everything personal (names, colors, school, calendar text, health items) comes from the
   decrypted data.family. Each fact has ONE home tab (data.family.agenda[i].home); Today only
   points at the other tabs, it never repeats their details. */
const TABS = [

  { id: "school", label: "School", ic: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9.5L12 5l9.5 4.5L12 14z"/><path d="M6.5 11.5v4.2c0 1.6 2.5 3.3 5.5 3.3s5.5-1.7 5.5-3.3v-4.2"/><path d="M21.5 9.5v5"/></svg>' },
  { id: "health", label: "Health", ic: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.4-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.6 12 20 12 20z"/><path d="M8 12h2.2l1.2-2 1.6 4 1.2-2H16"/></svg>' },
  { id: "money", label: "Money", ic: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3.5"/><path d="M3 10h18"/><path d="M16 14.5h2"/></svg>' },
];
const TI = Object.fromEntries(TABS.map(t => [t.id, t.ic]));

  chev: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
};
let TAB = "today";

/* ---- dates (all in Mountain Time) ---- */
const dKey = d => { const p = denverParts(d, { year: "numeric", month: "2-digit", day: "2-digit" }); return `${p.year}-${p.month}-${p.day}`; };
const addD = (s, n) => { const t = ymd(s); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const dayDiff = (a, b) => Math.round((ymd(b) - ymd(a)) / 864e5);
const wk = s => fmtD(s, { weekday: "short" });
function dayLabel(s, today) {
  const n = dayDiff(today, s);
  return n === 0 ? ["Today", fmtD(s, { weekday: "short", month: "short", day: "numeric" })] : n === 1 ? ["Tomorrow", fmtD(s, { weekday: "short", month: "short", day: "numeric" })]
    : [fmtD(s, { weekday: "long" }), fmtD(s, { month: "short", day: "numeric" })];
}
function relDue(s, today) {
  const n = dayDiff(today, s);
  if (n < 0) return [`Overdue · ${dayShort(s)}`, "late"];
  if (n === 0) return ["Due today", "soon"];
  if (n === 1) return ["Due tomorrow", "soon"];
  return [`Due ${fmtD(s, { weekday: "short", month: "short", day: "numeric" })}`, n <= 3 ? "soon" : ""];
}
function hm(iso) {
  const p = denverParts(new Date(iso), { hour: "numeric", minute: "2-digit", hour12: true });
  return [p.minute === "00" ? p.hour : `${p.hour}:${p.minute}`, (p.dayPeriod || "").toUpperCase()];
}

/* ---- context ---- */
function famCtx(data) {
  const F = data.family || {};
  const kids = F.kids || [], people = kids.concat(F.adults || []), byName = {};
  people.forEach(k => byName[k.name.toLowerCase()] = k);
  const neutral = F.family_color || "var(--c3)";
  const colorOf = names => (names && names.length && byName[names[0].toLowerCase()]) ? byName[names[0].toLowerCase()].color : neutral;
  const barOf = names => {
    const cs = (names || []).map(n => byName[n.toLowerCase()]).filter(Boolean).map(k => k.color);
    if (cs.length < 2) return cs[0] || neutral;
    const step = 100 / cs.length;
    return `linear-gradient(to bottom, ${cs.map((c, i) => `${c} ${(i * step).toFixed(1)}% ${((i + 1) * step).toFixed(1)}%`).join(", ")})`;
  };
  const chip = name => { const k = byName[(name || "").toLowerCase()]; return `<span class="kidchip" style="--k:${k ? k.color : neutral}">${esc(k ? k.name : "Family")}</span>`; };
  const chips = names => (names && names.length ? names : [null]).map(chip).join("");
  const now = new Date(), today = dKey(now);
  const agenda = F.agenda || [];
  const live = a => a.status !== "done" && (!a.date || (a.last || a.date) >= today) && !(a.end && !a.all_day && new Date(a.end) <= now);
  const of = home => agenda.filter(a => a.home === home);
  return { F, kids, byName, neutral, colorOf, barOf, chips, bot: (F.labels && F.labels.bot) || "", today, now, agenda, live, of, days: F.days || 14 };
}
function fEmpty(ctx, title, what, icon) {
  const who = ctx.bot ? `${esc(ctx.bot)} hasn't added ${what} yet.` : `Nothing has been added yet.`;
  return `<div class="fempty"><div class="wi">${icon || I.sprout}</div><div><b>${esc(title)}</b>${who}</div></div>`;
}

/* ---- agenda rows ---- */
function evRow(e, ctx) {
  let time;
  if (e.all_day) time = `<div class="ev-time allday">${e.kind === "birthday" ? "B-day" : e.kind === "early_release" ? "Early" : e.kind === "deadline" ? "Due" : "All day"}</div>`;
  else { const [t, ap] = hm(e.start); time = `<div class="ev-time num">${esc(t)}<small>${esc(ap)}</small></div>`; }
  const nowLive = !e.all_day && e.start && new Date(e.start) <= ctx.now && new Date(e.end) > ctx.now;
  const ongoing = e.last && e.date < ctx.today && e.last >= ctx.today;
  const tags = [];
  if (e.kind === "birthday") tags.push(`<span class="tag bday">${FI.cake}${e.turns ? "Turns " + e.turns : "Birthday"}</span>`);
  if (e.kind === "early_release") tags.push(`<span class="tag">Early release</span>`);
  if (nowLive) tags.push(`<span class="tag">Now</span>`);
  if (e.last) tags.push(`<span class="num">${ongoing ? "through" : "until"} ${esc(fmtD(e.last, { weekday: "short", month: "short", day: "numeric" }))}</span>`);
  const until = !e.all_day && e.end ? `<span class="num">until ${esc(hm(e.end).join("").toLowerCase())}</span>` : "";
  const tt = e.time_text ? `<span class="num">${esc(e.time_text)}</span>` : "";
  const kidsHtml = e.kind === "birthday" ? "" : ctx.chips(e.kids);
  return `<li class="ev ${nowLive ? "now" : ""}" style="--k:${ctx.colorOf(e.kids)};--kbar:${ctx.barOf(e.kids)}">${time}<div style="min-width:0">
    <div class="ev-title">${esc(e.title)}</div>
    <div class="ev-meta">${kidsHtml}${tags.join("")}${e.location ? `<span class="loc">${FI.pin}${esc(e.location)}</span>` : ""}${until}${tt}</div>
    ${(e.notes || []).map(n => `<div class="ev-note">${esc(n)}</div>`).join("")}</div></li>`;
}
function agendaList(list, ctx) {
  const days = [];
  list.forEach(e => { const d0 = e.date < ctx.today ? ctx.today : e.date; let d = days[days.length - 1]; if (!d || d.day !== d0) days.push(d = { day: d0, evs: [] }); d.evs.push(e); });
  return days.map(d => { const [a, b] = dayLabel(d.day, ctx.today);
    return `<div class="day"><div class="dayh ${d.day === ctx.today ? "today" : ""}"><b>${esc(a)}</b><span class="num">${esc(b)}</span></div>
      <ul class="evs">${d.evs.map(e => evRow(e, ctx)).join("")}</ul></div>`; }).join("");
}
const byWhen = (a, b) => ((a.date < b.date ? -1 : a.date > b.date ? 1 : 0) || (a.all_day === b.all_day ? 0 : a.all_day ? -1 : 1) || ((a.start || "") < (b.start || "") ? -1 : 1));
function dueRow(i, ctx) {
  const key = i.due || i.date, k = ctx.colorOf(i.kids);
  const [rel, cls] = key ? relDue(key, ctx.today) : ["", ""];
  const cal = key ? `<div class="cal k" style="--k:${k}"><small>${esc(fmtD(key, { month: "short" }))}</small><b class="num">${ymd(key).getUTCDate()}</b></div>` : `<div class="cal nodate"><b>—</b></div>`;
  return `<li>${cal}<div style="min-width:0"><div class="t">${esc(i.title)}</div>
    <div class="s">${ctx.chips(i.kids)}${rel ? `<span class="${cls}">${esc(rel)}</span>` : ""}</div>
    ${(i.notes || []).map(n => `<div class="cap" style="margin-top:4px">${esc(n)}</div>`).join("")}</div><span></span></li>`;
}
function laterRow(i, ctx) {
  const k = ctx.colorOf(i.kids);
  return `<li><div class="cal k" style="--k:${k}"><small>${esc(fmtD(i.date, { month: "short" }))}</small><b class="num">${ymd(i.date).getUTCDate()}</b></div><div style="min-width:0"><div class="t">${esc(i.title)}</div>
    <div class="s">${ctx.chips(i.kids)}<span>${esc(wk(i.date) + (i.date.slice(0, 4) !== ctx.today.slice(0, 4) ? ", " + i.date.slice(0, 4) : ""))}${i.start ? " · " + esc(hm(i.start).join("").toLowerCase()) : ""}</span></div>
    ${(i.notes || []).map(n => `<div class="cap" style="margin-top:4px">${esc(n)}</div>`).join("")}</div><span></span></li>`;
}
function contactRows(list) {
  const initials = n => n.replace(/^(mrs?|ms|dr)\.?\s+/i, "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");
  return `<ul class="rows">${list.map(c => `<li><div class="contact"><div class="avatar">${esc(initials(c.name))}</div>
    <div style="min-width:0"><div class="name" style="font-weight:600">${esc(c.name)}</div><div class="cap">${esc([c.role, c.phone].filter(Boolean).join(" · "))}</div>${c.notes ? `<div class="cap" style="color:var(--faint)">${esc(c.notes)}</div>` : ""}</div>
    <div class="acts">${c.phone ? `<a href="tel:${esc(c.phone.replace(/[^\d+]/g, ""))}" aria-label="Call">${FI.phone}</a>` : ""}${c.email ? `<a href="mailto:${esc(c.email)}" aria-label="Email">${FI.mail}</a>` : ""}</div></div></li>`).join("")}</ul>`;
}

/* ---- "left to spend" card (Today) ---- */
function budgetHalf(kind, row, data, ctx) {
  const T = (ctx.F.targets || {});
  let target = null, isDefault = false, left = null, spent = null, when = "";
  if (row) {
    const tKey = kind === "week" ? "weekly_burn_target" : "monthly_burn_target";
    if (isNum(row[tKey])) target = row[tKey];
    else { target = kind === "week" ? T.week_default : T.month_default; isDefault = isNum(target); }
    spent = isNum(row.spend_to_date) ? row.spend_to_date : null;
    const fKey = kind === "week" ? "free_household_cash_week" : "free_household_cash_month";
    left = isNum(row[fKey]) ? row[fKey] : (isNum(target) && isNum(spent) ? Math.round((target - spent) * 100) / 100 : null);
    when = kind === "week" ? weekRange(row.week_start, row.week_end) : fmtD(row.month + "-01", { month: "long" });
  }
  const over = isNum(left) && left < 0;
  const past = kind === "week" && row && row.week_end && row.week_end < ctx.today;
  const big = isNum(left)
    ? (() => { const [w, c] = nf2.format(Math.abs(left)).split("."); return `<div class="amt num ${over ? "over" : ""}">$${w}<span class="cents">.${c}</span><small>${over ? "over" : "left"}</small></div>`; })()
    : `<div class="amt blank">—</div>`;
  const ofTxt = isNum(target) ? `of <b class="num">${money(target)}</b> ${past ? "that week" : "this " + kind}${isDefault ? " · default" : ""}` : "";
  return `<div class="half"><div class="lab"><em>${kind === "week" ? (past ? "Last week" : "This week") : "This month"}</em><span class="num">${esc(when)}</span></div>${big}
    ${isNum(left) && isNum(target) ? `<div class="bar ${(isNum(spent) && spent > target) || over ? "over" : ""}"><i style="width:${(pct(isNum(spent) ? spent : target - left, target) * 100).toFixed(1)}%"></i></div>` : `<div class="bar"><i style="width:0"></i></div>`}
    <div class="of">${isNum(left) ? ofTxt : "Not recorded yet"}</div></div>`;
}
function budgetCard(data, ctx) {
  const W = data.weekly || null;
  const M = data.monthly && data.monthly.month === ctx.today.slice(0, 7) ? data.monthly : null;
  return `<section style="margin-top:20px"><div class="sh"><h2>Left to spend</h2><span class="meta">Household</span></div>
    <div class="card budget">${budgetHalf("week", W, data, ctx)}${budgetHalf("month", M, data, ctx)}</div></section>`;
}


/* ---- Today: budget + pointers ---- */
function upNext(data, ctx) {
  const rows = [], t = ctx.today, tm = addD(t, 1), wkEnd = addD(t, 6);
  const cal = ctx.of("calendar").filter(ctx.live);
  const nToday = cal.filter(a => a.date <= t).length, nTom = cal.filter(a => a.date === tm).length;
  const bds = cal.filter(a => a.kind === "birthday" && a.date <= wkEnd), bd = bds[0];
  const wkL = s => fmtD(s, { weekday: "long" });
  const cParts = [];
  if (nToday) cParts.push(`${nToday} ${nToday === 1 ? "event" : "events"} today`);
  if (nTom) cParts.push(`${nTom} tomorrow`);
  if (bds.length > 1) cParts.push(`${bds.length} birthdays this week`);
  else if (bd) cParts.push(`birthday ${bd.date === t ? "today" : bd.date === tm ? "tomorrow" : "on " + wkL(bd.date)}`);
  if (cParts.length) rows.push(["calendar", cap1(cParts.join(" · ")), ""]);
  const sch = ctx.of("school").filter(ctx.live);
  const off = sch.find(a => /no\s+school|break/i.test(a.title) && a.date <= t && (a.last || a.date) >= t);
  if (off) rows.push(["school", "School's out today", ""]);
  const er = sch.find(a => a.kind === "early_release" && a.date >= t && a.date <= wkEnd);
  if (er) rows.push(["school", `Early release ${er.date === t ? "today" : er.date === tm ? "tomorrow" : wk(er.date)}`, ""]);
  const dl = sch.filter(a => a.kind === "deadline" && (a.due || a.date) <= wkEnd);
  const late = dl.filter(a => (a.due || a.date) < t).length;
  if (dl.length) rows.push(["school", `${dl.length} school ${dl.length === 1 ? "deadline" : "deadlines"} this week${late ? ` · ${late} overdue` : ""}`, late ? "bad" : ""]);
  const H = ctx.F.health;
  if (H) {
    const zs = (H.name || "").split(" ")[0];
    const dls = H.items.filter(i => i.deadline).map(i => i.deadline).concat(H.deadlines || []);
    const od = dls.filter(d => d.due < t).length;
    if (od) rows.push(["health", `${od} ${zs} ${od === 1 ? "deadline" : "deadlines"} overdue`, "bad"]);
    const soon = dls.filter(d => d.due >= t && dayDiff(t, d.due) <= 30).sort((a, b) => a.due < b.due ? -1 : 1)[0];
    if (soon) rows.push(["health", `${zs} upload due in ${dayDiff(t, soon.due)} days`, ""]);
    else if (!od && H.items.length) rows.push(["health", `${H.items.length} open ${zs} ${H.items.length === 1 ? "item" : "items"}`, ""]);
  }
  const bills = ((data.bills && data.bills.items) || []).filter(b => !/\b(paid|autopay)\b/i.test(b.item || "") && b.due_date && b.due_date >= t && b.due_date <= addD(t, 2));
  if (bills.length) rows.push(["money", `${bills.length} ${bills.length === 1 ? "bill" : "bills"} due by ${wk(addD(t, 2))}`, ""]);
  return `<section><div class="sh"><h2>Up next</h2></div>
    ${rows.length ? `<div class="card upnext">${rows.map(([tab, txt, cls]) => `<button class="un ${cls}" data-go="${tab}"><span class="un-ic">${TI[tab]}</span><span class="un-t">${esc(txt)}</span><span class="un-tab">${esc(TABS.find(x => x.id === tab).label)}${FI.chev}</span></button>`).join("")}</div>`
      : `<div class="allclear">${I.check}<div>All clear<span>Nothing coming up that needs you.</span></div></div>`}</section>`;
}
function viewToday(data, ctx) {
  const p = denverParts(ctx.now, { weekday: "long", month: "long", day: "numeric" });
  const ph = typeof ctx.F.photo === "string" && /^data:image\/jpeg;base64,/.test(ctx.F.photo) ? ctx.F.photo : "";
  const when = `${esc(p.weekday)}, ${esc(p.month)} ${esc(p.day)}`;
  return (ph
    ? `<figure class="hero"><img src="${ph}" alt="The Walker family" decoding="async"><figcaption><span class="hk">The Walkers</span><h1>${greeting()}</h1><span class="hd">${when}</span></figcaption></figure>`
    : `<div class="fhead"><h1>${greeting()}</h1><div class="sub"><span class="dot"></span><span>${when}</span></div></div>`)
    + budgetCard(data, ctx) + upNext(data, ctx);
}

/* ---- Calendar ---- */
function viewCalendar(data, ctx) {
  const end = addD(ctx.today, ctx.days - 1);
  const all = ctx.of("calendar").filter(ctx.live).sort(byWhen);
  const list = all.filter(e => e.date <= end);
  const later = all.filter(e => e.date > end && e.kind !== "birthday");
  const cals = (ctx.F.calendars || []).filter(c => c.name);
  const out = [];
  out.push(`<div class="fhead"><h1>Next two weeks</h1><div class="sub num">${esc(dayShort(ctx.today))} – ${esc(dayShort(end))}${cals.length ? ` · ${esc(cals.map(c => c.name).join(" + "))} calendars` : ""}</div>
    ${ctx.kids.length ? `<div class="legendkids">${ctx.kids.map(k => `<span class="kidchip" style="--k:${k.color}">${esc(k.name)}</span>`).join("")}<span class="kidchip" style="--k:${ctx.neutral}">Family</span></div>` : ""}</div>`);
  out.push(`<section style="margin-top:22px">${list.length ? agendaList(list, ctx)
    : `<div class="card fhero"><div class="art">${FI.cal}</div><h3>A quiet two weeks</h3><p>Nothing on the calendars between now and ${esc(dayShort(end))}.</p></div>`}</section>`);
  if (later.length) out.push(`<section><div class="sh"><h2>Later</h2><span class="meta">${later.length} planned</span></div>
    <div class="card"><ul class="items">${later.map(e => laterRow(e, ctx)).join("")}</ul></div></section>`);
  return out.join("");
}

/* ---- School ---- */
function viewSchool(data, ctx) {
  const S = ctx.F.school, out = [];
  const students = ctx.kids.filter(k => k.school);
  const sch = ctx.of("school").filter(ctx.live).sort(byWhen);
  const dls = sch.filter(a => a.kind === "deadline").sort((a, b) => ((a.due || a.date) < (b.due || b.date) ? -1 : 1));
  const dates = sch.filter(a => a.kind !== "deadline");
  const late = dls.filter(a => (a.due || a.date) < ctx.today).length;
  out.push(`<div class="fhead"><h1>School</h1><div class="sub">${students.length ? `${students.length} students` : ""}</div></div>`);
  const fact = (k, v) => v ? `<div class="fact"><span>${k}</span><b>${v}</b></div>` : "";
  const tel = p => `<a href="tel:${esc(p.replace(/[^\d+]/g, ""))}">${esc(p)}</a>`, mail = m => `<a href="mailto:${esc(m)}">${esc(m)}</a>`;
  out.push(`<section style="margin-top:18px">${S ? `<div class="card school"><div class="sch-top"><div class="sch-ic">${FI.school}</div><div><h3>${esc(S.name)}</h3><div class="city">${esc(S.city || "")}</div></div></div>
      <div class="facts">${fact("School hours", esc(S.hours || "—"))}${fact("Early release", esc(S.early_release || "—"))}
      ${fact("Address", S.address ? esc(S.address) : "")}
      ${fact("Office", [S.phone && tel(S.phone), S.office_email && mail(S.office_email)].filter(Boolean).join("<br>"))}
      ${fact("PTO", [S.pto_email && mail(S.pto_email), S.pto_phone && tel(S.pto_phone)].filter(Boolean).join("<br>"))}</div>
      ${students.length ? `<div class="kids">${students.map(k => `<span class="kidchip" style="--k:${k.color}">${esc(k.name)} <small>· ${esc(k.detail || "")}</small></span>`).join("")}</div>` : ""}</div>`
    : ""}</section>`);
  out.push(`<section><div class="sh"><h2>Forms &amp; deadlines</h2><span class="meta">${dls.length ? `${dls.length} open${late ? ` · <span class="late">${late} overdue</span>` : ""}` : ""}</span></div>
    ${dls.length ? `<div class="card"><ul class="items">${dls.map(i => dueRow(i, ctx)).join("")}</ul></div>` : fEmpty(ctx, "No forms or deadlines", "any forms or deadlines", FI.flag)}</section>`);
  out.push(`<section><div class="sh"><h2>School dates</h2><span class="meta">${dates.length ? dates.length + " coming up" : ""}</span></div>
    ${dates.length ? agendaList(dates, ctx) : fEmpty(ctx, "No school dates yet", "any school dates", FI.cal.replace(/30/g, "20"))}</section>`);
  if ((ctx.F.contacts_school || []).length) out.push(`<section><div class="sh"><h2>Teachers</h2></div><div class="card">${contactRows(ctx.F.contacts_school)}</div></section>`);
  return out.join("");
}

/* ---- Health ---- */
function viewHealth(data, ctx) {
  const H = ctx.F.health, out = [];
  out.push(`<div class="fhead"><h1>Health</h1><div class="sub">${H ? `${esc(H.name)} · ${H.items.length} open ${H.items.length === 1 ? "item" : "items"}` : ""}</div></div>`);
  if (!H) return out.join("") + `<section style="margin-top:22px">${fEmpty({ bot: "" }, "Health tracker not connected", "")}</section>`;
  const lvl = { high: ["High priority", "bad"], unconfirmed: ["Unconfirmed", "warn"], open: ["Open", "warn"], unknown: ["Unknown", "ns"] };
  const dlLine = d => { const over = d.due < ctx.today;
    return `<div class="dl ${over ? "over" : ""}">${over ? "Overdue" : "Upload by"} · <b class="num">${esc(longDate(d.due))}</b><span> · service ${esc(longDate(d.dos))}</span></div>`; };
  const people = [];
  H.items.forEach(i => { let p = people.find(x => x.who === i.who); if (!p) people.push(p = { who: i.who, items: [] }); p.items.push(i); });
  const od = H.items.filter(i => i.deadline && i.deadline.due < ctx.today).length + (H.deadlines || []).filter(d => d.due < ctx.today).length;
  if (od) out.push(`<div class="alert bad">${FI.flag}<div>${od} upload ${od === 1 ? "deadline has" : "deadlines have"} passed<span>Still open, marked in red below</span></div></div>`);
  out.push(people.map(p => { const k = ctx.byName[p.who.toLowerCase()]; const tot = p.items.reduce((s, i) => s + (isNum(i.amount) ? i.amount : 0), 0);
    return `<section><div class="sh"><h2><span class="pdot" style="--k:${k ? k.color : ctx.neutral}"></span>${esc(p.who)}</h2><span class="meta num">${money(tot)}</span></div>
      <div class="card"><ul class="hitems">${p.items.map(i => { const [lt, lc] = lvl[i.level] || lvl.unknown; const over = i.deadline && i.deadline.due < ctx.today;
        return `<li class="${over ? "isover" : ""}"><div class="row"><span class="name">${esc(i.item)}</span><span class="val num">${money(i.amount)}</span></div>
          <div class="hmeta"><span class="chip ${lc === "bad" || over ? "bad" : lc === "warn" ? "warn" : "ns"}">${esc(over ? "Overdue · " + lt : lt)}</span></div>
          ${i.status && !/^status\s+unknown$/i.test(i.status.trim()) ? `<div class="cap">${esc(i.status)}</div>` : ""}${i.deadline ? dlLine(i.deadline) : ""}
          ${i.next ? `<div class="next"><b>Next:</b> ${esc(i.next)}</div>` : ""}</li>`; }).join("")}</ul></div></section>`; }).join(""));
  if ((H.deadlines || []).length) out.push(`<section><div class="sh"><h2>Other upload deadlines</h2><span class="meta">Service date + 6 months</span></div>
    <div class="card"><ul class="hitems">${H.deadlines.map(d => `<li class="${d.due < ctx.today ? "isover" : ""}"><div class="row"><span class="name">${esc(d.who)} · ${esc(d.what)}</span></div>${dlLine(d)}${d.status ? `<div class="cap">${esc(d.status)}</div>` : ""}</li>`).join("")}</ul></div></section>`);
  return out.join("");
}

function renderShell(data, topbar, moneyHTML) {
  const ctx = famCtx(data);
  const h = location.hash.slice(1);
  if (TABS.some(t => t.id === h)) TAB = h;
  const idx = TABS.findIndex(t => t.id === TAB);
  const views = { today: viewToday(data, ctx), calendar: viewCalendar(data, ctx), school: viewSchool(data, ctx),
    health: viewHealth(data, ctx), money: moneyHTML };
  document.body.classList.add("has-tabs");
  const H = ctx.F.health;
  const healthDot = H && (H.items.some(i => i.deadline && i.deadline.due < ctx.today) || (H.deadlines || []).some(d => d.due < ctx.today));
  return topbar + TABS.map(t => `<div class="view ${t.id === TAB ? "on" : ""}" id="view-${t.id}" role="tabpanel" aria-label="${t.label}">${views[t.id]}${t.id !== "money" ? `<footer>Private · end-to-end encrypted · times in Mountain Time</footer>` : ""}</div>`).join("")
    + `<nav class="tabbar" role="tablist" style="--i:${idx}"><span class="pill"></span>${TABS.map(t => `<button role="tab" data-tab="${t.id}" aria-selected="${t.id === TAB}">${t.ic}<span>${t.label}</span>${t.id === "health" && healthDot ? '<i class="tdot"></i>' : ""}</button>`).join("")}</nav>`;
}
const scrollPos = {};
function showTab(id, push) {
  if (id === TAB) { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  const from = TABS.findIndex(t => t.id === TAB), to = TABS.findIndex(t => t.id === id);
  scrollPos[TAB] = window.scrollY;
  const old = $("#view-" + TAB), nu = $("#view-" + id);
  if (!old || !nu) return;
  old.classList.remove("on");
  nu.style.setProperty("--dx", (to > from ? 22 : -22) + "px");
  nu.classList.remove("on"); void nu.offsetWidth; nu.classList.add("on");
  TAB = id;
  $(".tabbar").style.setProperty("--i", to);
  document.querySelectorAll(".tabbar button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === id));
  window.scrollTo(0, scrollPos[id] || 0);
  if (push) history.replaceState(null, "", "#" + id);
  if (id === "money") whenChart(drawCharts);
}
function wireTabs() {
  document.querySelectorAll(".tabbar button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab, true)));
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => { showTab(b.dataset.go, true); window.scrollTo(0, 0); }));
  window.onhashchange = () => { const h = location.hash.slice(1); if (TABS.some(t => t.id === h)) showTab(h, false); };
}

/* ------------------------------------------------ charts */
function whenChart(cb) {
  if (window.Chart) return cb();
  let n = 0; const t = setInterval(() => { if (window.Chart || ++n > 50) { clearInterval(t); if (window.Chart) cb(); } }, 100);
}
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function drawCharts() {
  charts.forEach(c => c.destroy()); charts = [];
  if (!DATA || !window.Chart) return;
  const Chart = window.Chart;
  Chart.defaults.font.family = css("--font");
  Chart.defaults.color = css("--muted");
  const tip = { backgroundColor: css("--card"), titleColor: css("--ink"), bodyColor: css("--ink2"), borderColor: css("--line"), borderWidth: 1,
    padding: 10, cornerRadius: 12, displayColors: true, boxPadding: 4, usePointStyle: true,
    callbacks: { label: c => ` ${c.dataset.label}: ${money(c.parsed.y, false)}` } };
  const mb = DATA.history.monthly_buckets;
  const cash = document.getElementById("cashChart");
  if (cash && mb.length) {
    const years = new Set(mb.map(m => m.month.slice(0, 4)));
    const labels = mb.map(m => fmtD(m.month + "-01", years.size > 1 ? { month: "short", year: "2-digit" } : { month: "short" }));
    const ctx = cash.getContext("2d"), g = ctx.createLinearGradient(0, 0, 0, 220);
    g.addColorStop(0, css("--accent-soft")); g.addColorStop(1, "rgba(0,0,0,0)");
    const ds = (label, key, color, extra) => ({ label, data: mb.map(m => m[key]), borderColor: color, backgroundColor: color, borderWidth: 2.5,
      tension: .35, pointRadius: mb.map((_, i) => i === mb.length - 1 ? 3.5 : 0), pointHoverRadius: 5, spanGaps: true, ...extra });
    charts.push(new Chart(cash, { type: "line", data: { labels, datasets: [
        ds("Household", "household_cash", css("--accent"), { fill: true, backgroundColor: g, pointBackgroundColor: css("--accent") }),
        ds("Practice", "practice_cash", css("--c2")),
        ds("Tax reserve", "tax_reserve", css("--c3"), { borderDash: [6, 5], borderWidth: 2 }) ] },
      options: { maintainAspectRatio: false, animation: { duration: 600 }, transitions: { resize: { animation: { duration: 0 } } }, interaction: { mode: "index", intersect: false },
        plugins: { legend: { display: false }, tooltip: tip },
        layout: { padding: { top: 6, right: 4 } },
        scales: { x: { grid: { display: false }, border: { display: false }, ticks: { font: { size: 12 } } },
          y: { grid: { display: false }, border: { display: false }, ticks: { maxTicksLimit: 4, font: { size: 12 }, callback: kMoney } } } } }));
  }
  const lh = DATA.history.loan_balances;
  if (lh) lh.series.forEach(s => {
    const el = document.getElementById("loan" + s.loan_order); if (!el) return;
    const vals = s.balances.filter(isNum); if (!vals.length) return;
    charts.push(new Chart(el, { type: "line", data: { labels: lh.dates.map(dayShort), datasets: [{ label: cap1(s.loan_name), data: s.balances,
        borderColor: css("--accent"), borderWidth: 2.25, tension: .35, spanGaps: true, fill: false,
        pointRadius: s.balances.map((_, i) => i === s.balances.length - 1 ? 3 : 0), pointBackgroundColor: css("--accent") }] },
      options: { maintainAspectRatio: false, animation: { duration: 600 }, transitions: { resize: { animation: { duration: 0 } } }, interaction: { mode: "index", intersect: false },
        plugins: { legend: { display: false }, tooltip: tip }, layout: { padding: { top: 4, bottom: 4, left: 2, right: 4 } },
        scales: { x: { display: false }, y: { display: false, grace: "8%" } } } }));
  });
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => DATA && drawCharts());

/* ------------------------------------------------ lock / unlock */
function showLock(msg) {
  $("#boot").hidden = true; $("#app").hidden = true; $("#app").innerHTML = ""; $("#lock").hidden = false;
  $("#demoHint").hidden = !DEMO;
  const e = $("#lockErr"); e.textContent = msg || ""; e.classList.toggle("show", !!msg);
}
async function lockNow() {
  charts.forEach(c => c.destroy()); charts = []; DATA = null; document.body.classList.remove("has-tabs");
  await forgetAll();
  $("#pw").value = "";
  showLock("");
  $("#pw").focus();
}
$("#eye").addEventListener("click", () => { const p = $("#pw"); p.type = p.type === "password" ? "text" : "password"; $("#eye").setAttribute("aria-label", p.type === "password" ? "Show password" : "Hide password"); });
$("#pw").addEventListener("input", () => $("#lockErr").classList.remove("show"));
$("#lockForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const pw = $("#pw").value, btn = $("#unlockBtn");
  if (!pw) return;
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Unlocking…';
  try {
    const env = await loadEnv();
    let data;
    try { data = await decryptEnv(env, pw); }
    catch (e) { throw Object.assign(new Error("badpw"), { badpw: true }); }
    if ($("#remember").checked) await remember(pw); else localStorage.removeItem(STORE);
    $("#pw").value = "";
    render(data);
  } catch (e) {
    envPromise = e.badpw ? envPromise : null;
    showLock(e.badpw ? "That's not quite it — give it another try." : "Couldn't load the dashboard right now. Check your connection and try again.");
    $("#pw").select();
  } finally { btn.disabled = false; btn.textContent = "Unlock"; }
});

(async function boot() {
  if (!window.crypto || !crypto.subtle) { showLock("This page needs a secure (https) connection to unlock."); return; }
  loadEnv().catch(() => {});
  const pw = await recall();
  if (pw) {
    try { render(await decryptEnv(await loadEnv(), pw)); return; }
    catch (e) { if (e && e.name === "OperationError") await forgetAll(); }
  }
  showLock("");
  if (matchMedia("(pointer:fine)").matches) $("#pw").focus();
})();
})();
</script>
